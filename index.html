<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Александр Python разработчик</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<style>
:root {
    --bg: #05080e;
    --bg2: #080d16;
    --card: rgba(12, 17, 27, .72);
    --text: #eef3fa;
    --soft: #a2adbd;
    --muted: #68758a;
    --line: rgba(117, 143, 179, .16);
    --line-soft: rgba(117, 143, 179, .09);
    --cyan: #00d9ff;
    --blue: #438cff;
    --purple: #765cff;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
    margin: 0;
    min-width: 320px;
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
        radial-gradient(650px 500px at 5% 4%, rgba(0, 210, 255, .105), transparent 72%),
        radial-gradient(700px 520px at 97% 24%, rgba(87, 61, 255, .10), transparent 72%),
        radial-gradient(650px 480px at 72% 88%, rgba(0, 116, 255, .075), transparent 72%),
        linear-gradient(145deg, #03060b 0%, #070b12 50%, #060912 100%);
    -webkit-font-smoothing: antialiased;
}

/* subtle developer-style grid */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .48;
    background-image:
        linear-gradient(rgba(105, 145, 190, .055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(105, 145, 190, .055) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: linear-gradient(
        to bottom,
        black 0%,
        black 55%,
        rgba(0,0,0,.45) 80%,
        transparent 100%
    );
}

/* very soft colored areas behind the content */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 16% 36%, rgba(0, 219, 255, .035), transparent 25%),
        radial-gradient(circle at 83% 60%, rgba(118, 78, 255, .035), transparent 28%);
}

button, a { font: inherit; }
a { color: inherit; }

.page {
    width: min(1080px, calc(100% - 40px));
    margin: 0 auto;
    position: relative;
}

/* ABOUT */

.about {
    display: grid;
    grid-template-columns: 210px minmax(0, 1fr);
    gap: 65px;
    align-items: center;
    padding: 70px 0 64px;
}

.profile {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.avatar {
    width: 174px;
    height: 174px;
    object-fit: cover;
    border-radius: 50%;
    border: 1px solid rgba(0, 218, 255, .34);
    box-shadow:
        0 0 0 6px rgba(0, 207, 255, .025),
        0 25px 70px rgba(0, 92, 150, .17);
}

.contacts {
    width: 100%;
    display: grid;
    gap: 9px;
    margin-top: 22px;
}

.contact {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    color: var(--soft);
    text-decoration: none;
    font-size: 13px;
    transition: color .18s ease;
}

.contact:hover { color: #fff; }

.contact-icon {
    width: 16px;
    color: var(--cyan);
    text-align: center;
}

.description {
    max-width: 770px;
    color: #aeb9c9;
    font-size: 15px;
    line-height: 1.78;
}

.description br + br {
    content: "";
    display: block;
    margin-top: 8px;
}

/* SECTION TITLE */

.projects-section {
    padding-bottom: 80px;
}

.section-title {
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 0 0 30px;
    color: #aeb9c9;
    font-size: 16px;
    line-height: 1;
    font-weight: 400;
    letter-spacing: -.02em;
    white-space: nowrap;
}

.section-title::before,
.section-title::after {
    content: "";
    height: 1px;
    flex: 1;
}

.section-title::before {
    background: linear-gradient(
        90deg,
        transparent,
        rgba(111, 145, 185, .25)
    );
}

.section-title::after {
    background: linear-gradient(
        90deg,
        rgba(111, 145, 185, .25),
        transparent
    );
}

/* PROJECTS */

.projects {
    display: grid;
    gap: 0;
}

.project {
    padding: 0 0 28px;
    background: transparent;
}

/* separator between projects */
.project + .project {
    padding-top: 28px;
}

/* PREVIEWS */

.previews {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    height: 70px;
    overflow: hidden;
}

.preview {
    flex: 0 0 auto;
    width: auto;
    height: 70px;
    max-width: 280px;
    padding: 0;
    border: 0;
    border-radius: 7px;
    overflow: hidden;
    background: #080c14;
    cursor: pointer;
}

.preview img {
    display: block;
    width: auto;
    height: 50px;
    max-width: 280px;
    object-fit: contain;
    filter: saturate(.62) brightness(.82);
    transition: transform .25s ease, opacity .25s ease, filter .25s ease;
}

.preview:hover img {
    transform: scale(1.05);
    filter: none;
}

/* PROJECT INFO */

.project-info {
    padding: 0 1px 0;
}

.project-header {
    display: flex;
    align-items: baseline;
}

.project-title {
    margin: 0;
    font-size: 16px;
    line-height: 1.35;
    font-weight: 700;
    letter-spacing: -.012em;
}

.project-title a {
    text-decoration: none;
}

.project-title a:hover {
    color: var(--cyan);
}

.short-description {
    margin-top: 5px;
    color: var(--soft);
    font-size: 13px;
    line-height: 1.5;
}

.expand {
    display: block;
    margin-top: 7px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--cyan);
    font-size: 12px;
    cursor: pointer;
}

.expand:hover {
    color: #79eaff;
}

.details {
    margin-top: 12px;
    padding: 15px 16px;
    border-radius: 8px;
    background: rgba(8, 13, 22, .60);
    color: #aab6c8;
    font-size: 13px;
    line-height: 1.7;
}

.details-content {
    white-space: normal;
}

.details-content br + br {
    content: "";
    display: block;
    margin-top: 8px;
}

.term {
    margin-bottom: 13px;
    color: #77859a;
    font-size: 11px;
}

.details-group {
    margin-top: 16px;
}

.details-label {
    margin-bottom: 7px;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .12em;
}

.integration-list {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 14px;
}

.integration-item {
    color: #8fdfff;
    font-weight: 650;
}

.integration-item:not(:last-child)::after {
    content: "·";
    margin-left: 14px;
    color: #50637b;
    font-weight: 400;
}

.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
}

.technologies {
    margin-top: 12px;
}

.chip {
    padding: 6px 10px;
    border: 1px solid rgba(0, 205, 255, .15);
    border-radius: 999px;
    background: rgba(0, 191, 255, .055);
    color: #8fdcf0;
    font-size: 12px;
    line-height: 1.2;
}

/* GALLERY */

.gallery {
    position: fixed;
    z-index: 100;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: rgba(2, 5, 10, .96);
    backdrop-filter: blur(14px);
}

.gallery-header {
    height: 58px;
    flex: 0 0 58px;
    display: flex;
    align-items: center;
    padding: 0 20px;
}

.gallery-counter {
    margin-right: auto;
    color: var(--muted);
    font-size: 12px;
}

.gallery-close {
    width: 38px;
    height: 38px;
    padding: 0 0 6px 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #dbe5f2;
    font-size: 27px;
    line-height: 1;
    cursor: pointer;
}

.gallery-close:hover {
    background: rgba(255,255,255,.06);
}

.gallery-stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 75px;
}

.gallery-image {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 140px);
    object-fit: contain;
    border-radius: 5px;
}

.gallery-arrow {
    position: absolute;
    top: 50%;
    width: 44px;
    height: 44px;
    padding: 0 0 7px 0;
    border: 1px solid rgba(117, 151, 195, .18);
    border-radius: 50%;
    background: rgba(17, 28, 44, .82);
    color: white;
    font-size: 25px;
    cursor: pointer;
    transform: translateY(-50%);
}

.gallery-arrow:hover {
    border-color: rgba(0, 217, 255, .30);
    background: rgba(25, 45, 68, .95);
}

.gallery-prev { left: 20px; }
.gallery-next { right: 20px; }

.gallery-thumbnails {
    display: flex;
    justify-content: center;
    gap: 7px;
    max-width: 100%;
    overflow-x: auto;
    padding: 5px 20px 16px;
}

.gallery-thumbnail {
    width: 82px;
    height: 52px;
    flex: 0 0 auto;
    padding: 0;
    border: 1px solid rgba(117, 151, 195, .14);
    border-radius: 5px;
    overflow: hidden;
    background: transparent;
    opacity: .42;
    cursor: pointer;
}

.gallery-thumbnail.active {
    border-color: var(--cyan);
    opacity: 1;
}

.gallery-thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

@media (max-width: 760px) {
    .page {
        width: min(100% - 24px, 650px);
    }

    .about {
        grid-template-columns: 1fr;
        gap: 30px;
        padding: 48px 0 48px;
    }

    .profile {
        order: 2;
    }

    .description {
        font-size: 14px;
    }

    .gallery-stage {
        padding: 15px 54px;
    }

    .gallery-prev { left: 7px; }
    .gallery-next { right: 7px; }
}

@media (max-width: 470px) {
    .page {
        width: calc(100% - 20px);
    }

    .avatar {
        width: 155px;
        height: 155px;
    }

    .section-title {
        font-size: 19px;
        gap: 12px;
    }

    .previews {
        height: 70px;
    }

    .preview,
    .preview img {
        height: 70px;
    }

    .preview {
        max-width: 220px;
    }

    .preview img {
        max-width: 220px;
    }
}
</style>
</head>

<body>
<div id="app">
    <main class="page">

        <section class="about">
            <div class="profile">
                <img class="avatar" :src="DATA.avatar" alt="Фото">

                <div class="contacts">
                    <a class="contact" :href="'mailto:' + DATA.email">
                        <span class="contact-icon">✉</span>
                        <span>{{ DATA.email }}</span>
                    </a>

                    <a
                        v-if="DATA.link_github"
                        class="contact"
                        :href="url(DATA.link_github)"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <span class="contact-icon">◉</span>
                        <span>GitHub</span>
                    </a>

                    <a
                        v-if="DATA.link_resume"
                        class="contact"
                        :href="url(DATA.link_resume)"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <span class="contact-icon">▤</span>
                        <span>Резюме</span>
                    </a>
                </div>
            </div>

            <div
                class="description"
                v-html="formatDescription(DATA.description)"
            ></div>
        </section>


        <section class="projects-section">
            <h2 class="section-title">
                <span>некоторые проекты</span>
            </h2>

            <div class="projects">

                <article
                    v-for="project in DATA.projects"
                    :key="project.id"
                    class="project"
                >
                                            <div class="project-header">
                            <h3 class="project-title">
                                <a
                                    v-if="project.link"
                                    :href="url(project.link)"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >
                                    {{ project.title }} ↗
                                </a>

                                <template v-else>
                                    {{ project.title }}
                                </template>
                            </h3>
                        </div>

                    <div
                        v-if="project.previews && project.previews.length"
                        class="previews"
                    >
                        <button
                            v-for="(image, index) in project.previews"
                            :key="image"
                            type="button"
                            class="preview"
                            @click.stop="openGallery(project, index)"
                        >
                            <img
                                :src="previewPath(image)"
                                :alt="project.title"
                            >
                        </button>
                    </div>


                    <div class="project-info">




                        <div class="short-description">
                            {{ project.short_desc }}
                        </div>


                        <button
                            type="button"
                            class="expand"
                            @click.stop="toggleDescription(project.id)"
                        >
                            {{ isOpen(project.id)
                                ? '⌃ Свернуть описание'
                                : '› Развернуть описание'
                            }}
                        </button>


                        <div
                            v-if="isOpen(project.id)"
                            class="details"
                        >
                            <div class="term">
                                {{ project.term }}
                            </div>

                            <div
                                class="details-content"
                                v-html="formatDescription(project.desc)"
                            ></div>

                            <div
                                v-if="project.api && project.api.length"
                                class="details-group"
                            >
                                <div class="details-label">API</div>
                                <div class="integration-list">
                                    <span
                                        v-for="item in project.api"
                                        :key="item"
                                        class="integration-item"
                                    >
                                        {{ item }}
                                    </span>
                                </div>
                            </div>

                            <div
                                v-if="project.parsing && project.parsing.length"
                                class="details-group"
                            >
                                <div class="details-label">Parsing</div>
                                <div class="integration-list">
                                    <span
                                        v-for="item in project.parsing"
                                        :key="item"
                                        class="integration-item"
                                    >
                                        {{ item }}
                                    </span>
                                </div>
                            </div>
                        </div>


                        <div
                            v-if="project.tags && project.tags.length"
                            class="technologies chips"
                        >
                            <template
                                v-for="tagId in project.tags"
                                :key="tagId"
                            >
                                <span
                                    v-if="tag(tagId)"
                                    class="chip"
                                >
                                    {{ tag(tagId).title }}
                                </span>
                            </template>
                        </div>

                    </div>
                </article>

            </div>
        </section>
    </main>


    <div
        v-if="gallery"
        class="gallery"
        tabindex="0"
        ref="galleryElement"
    >
        <div class="gallery-header">
            <span class="gallery-counter">
                {{ gallery.index + 1 }} / {{ gallery.project.previews.length }}
            </span>

            <button
                type="button"
                class="gallery-close"
                @click="closeGallery"
                aria-label="Закрыть"
            >×</button>
        </div>

        <div class="gallery-stage">
            <button
                type="button"
                class="gallery-arrow gallery-prev"
                @click="previous"
                aria-label="Предыдущее изображение"
            >‹</button>

            <img
                class="gallery-image"
                :src="previewPath(gallery.project.previews[gallery.index])"
                :alt="gallery.project.title"
            >

            <button
                type="button"
                class="gallery-arrow gallery-next"
                @click="next"
                aria-label="Следующее изображение"
            >›</button>
        </div>

        <div class="gallery-thumbnails">
            <button
                v-for="(image, index) in gallery.project.previews"
                :key="image"
                type="button"
                class="gallery-thumbnail"
                :class="{ active: index === gallery.index }"
                @click="gallery.index = index"
            >
                <img
                    :src="previewPath(image)"
                    :alt="gallery.project.title"
                >
            </button>
        </div>
    </div>
</div>


<script src="data.js"></script>

<script>
const { createApp, ref, onMounted, onUnmounted } = Vue;

createApp({
    setup() {
        /*
         * ВАЖНО:
         * Состояние раскрытия НЕ записывается в DATA.
         * Поэтому DATA остаётся полностью неизменным.
         *
         * Храним id единственного открытого проекта отдельно.
         */
        const openProjectId = ref(null);
        const gallery = ref(null);
        const galleryElement = ref(null);

        function url(value) {
            if (!value) return '#';

            return /^https?:\/\//i.test(value)
                ? value
                : 'https://' + value;
        }

        function previewPath(path) {
            if (!path) return '';

            return path.startsWith('previews/')
                ? path
                : 'previews/' + path;
        }

        function formatDescription(value) {
            if (!value) return '';

            return String(value)
                .trim()
                .replace(/\r\n/g, '\n')
                .replace(/\n/g, '<br>');
        }

        function tag(id) {
            if (!Array.isArray(DATA.tags)) return null;

            // Сопоставляем и числа, и строки: например 1 === "1"
            return DATA.tags.find(
                item => String(item.id) === String(id)
            ) || null;
        }

        function isOpen(projectId) {
            return openProjectId.value === projectId;
        }

        function toggleDescription(projectId) {
            openProjectId.value =
                openProjectId.value === projectId
                    ? null
                    : projectId;
        }

        function openGallery(project, index) {
            /*
             * Открытие изображения НИКОГДА не меняет
             * состояние описания проекта.
             */
            gallery.value = {
                project,
                index
            };

            document.body.style.overflow = 'hidden';

            requestAnimationFrame(() => {
                galleryElement.value?.focus();
            });
        }

        function closeGallery() {
            gallery.value = null;
            document.body.style.overflow = '';
        }

        function next() {
            if (!gallery.value) return;

            const count = gallery.value.project.previews.length;

            gallery.value.index =
                (gallery.value.index + 1) % count;
        }

        function previous() {
            if (!gallery.value) return;

            const count = gallery.value.project.previews.length;

            gallery.value.index =
                (gallery.value.index - 1 + count) % count;
        }

        function keyboard(event) {
            if (!gallery.value) return;

            if (event.key === 'Escape') closeGallery();
            if (event.key === 'ArrowRight') next();
            if (event.key === 'ArrowLeft') previous();
        }

        onMounted(() => {
            window.addEventListener('keydown', keyboard);
        });

        onUnmounted(() => {
            window.removeEventListener('keydown', keyboard);
            document.body.style.overflow = '';
        });

        return {
            DATA,
            openProjectId,
            gallery,
            galleryElement,
            url,
            previewPath,
            formatDescription,
            tag,
            isOpen,
            toggleDescription,
            openGallery,
            closeGallery,
            next,
            previous
        };
    }
}).mount('#app');
</script>
</body>
</html>
